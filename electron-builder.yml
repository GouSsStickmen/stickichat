appId: com.stickmen.stickichat
productName: StickiChat
directories:
  output: release
files:
  - out/**
  - package.json
win:
  target: nsis
  icon: build/icon.ico
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
publish:
  provider: github
  owner: GouSsStickmen
  repo: stickichat
  releaseType: release
# Shown in the in-app "update available" popup (electron-updater reads the GitHub release
# body). Update this list every release — items only, no service/signature footer line.
releaseInfo:
  releaseNotes: |
    StickiChat 0.5.8 - що нового:

    - Звуки сповіщень більше не дублюються: раніше кожне відкрите вікно програвало свій сигнал окремо
    - Для кожного типу згадування - окремий перемикач "звучати навіть на активній вкладці"
    - Нове сповіщення на варіації вашого ніка (написання, які Twitch не ловить через "@") зі своїм звуком
    - Пікер: показуються ВСІ емоути каналу навіть без підписки - доступні першими, сабівські під замочком
    - Бейджі FrankerFaceZ; усі сторонні бейджі (7TV, BTTV, FFZ) з прев'ю при наведенні
    - Широкі емоути отримують широкі комірки; у передпоказі видно автора з переходом на його канал
    - Комбіновані емоути більше не видаляють один одного в обраних
    - Пікер: Ctrl+ЛКМ - сторінка емоута, Ctrl+Shift+ЛКМ - канал автора
    - Конвертер розкладки більше не псує назви емоутів
    - Помилки можна приховати назавжди кнопкою "більше не показувати"
    - Список глядачів: виправлено відсутні секції модераторів і віпів, прокрутка стала плавною
    - Оверлей: тригер-реакції стають туди, куди їх ставиш, і позицію видно наживо під час налаштування
    - Виправлено зникнення чату на долю секунди
    - Кнопки масштабу замінено на лупу; прев'ю посилань більше не обрізається за краєм вікна
    - Застосунок тепер під ліцензією GPL-3.0

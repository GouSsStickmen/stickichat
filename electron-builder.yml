appId: com.stickmen.stickichat
productName: StickiChat
directories:
  output: release
files:
  - out/**
  - package.json
win:
  target: nsis
  icon: build/icon.ico
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
publish:
  provider: github
  owner: GouSsStickmen
  repo: stickichat
  releaseType: release
# Shown in the in-app "update available" popup and as the GitHub release body
# (electron-updater reads that body). Generated from changelog.ts by scripts/release.ps1 on every
# publish, so it can no longer be left describing the version before this one.
releaseInfo:
  releaseNotesFile: release-notes.md

appId: com.stickmen.stickichat
productName: StickiChat
directories:
  output: release
files:
  - out/**
  - package.json
win:
  target: nsis
  icon: build/icon.ico
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
publish:
  provider: github
  owner: GouSsStickmen
  repo: stickichat
  releaseType: release
# Shown in the in-app "update available" popup (electron-updater reads the GitHub release
# body). Update this list every release — items only, no service/signature footer line.
releaseInfo:
  releaseNotes: |
    StickiChat 0.5.10 - що нового:

    - Сповіщення про слова й варіанти ніка: галочка "лише точний збіг" - "стікмен" більше не ловить "стікменсва"
    - Кольори 7TV підхоплюються за дві хвилини замість десяти; помічається й колір, поставлений уперше
    - Редактор тем - окрема панель із заголовком; кнопки збереження закріплені знизу і не тікають за екран
    - Вузьке вікно налаштувань більше не обрізає контроли - рядки переносяться на всіх вкладках
    - Повзунок масштабу працює й тоді, коли налаштування відкриті панеллю в чаті
    - Вікно налаштувань не звужується менше за розумну межу
    - Виправлено палітру, яка при збільшеному масштабі відлітала від кнопки й вилазила за межі вікна
    - Виправлено з'їхалі галочки у списку каналів мод-кнопки
    - Кеш косметики 7TV більше не витісняє історію чату зі сховища
    - Виправлено рідкісний випадок, коли невдале читання стирало збережену історію каналу назавжди

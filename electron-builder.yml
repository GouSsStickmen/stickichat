appId: com.stickmen.stickichat
productName: StickiChat
directories:
  output: release
files:
  - out/**
  - package.json
win:
  target: nsis
  icon: build/icon.ico
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
publish:
  provider: github
  owner: GouSsStickmen
  repo: stickichat
  releaseType: release
# Shown in the in-app "update available" popup (electron-updater reads the GitHub release
# body). Update this list every release — items only, no service/signature footer line.
releaseInfo:
  releaseNotes: |
    StickiChat 0.5.9 - що нового:

    - П'ять нових тем: AMOLED, Midnight, Nord, Gruvbox і Rose; у виборі кожна намальована власними кольорами
    - Редактор тем: створюйте, зберігайте й редагуйте власні теми, обмінюйтесь ними через імпорт/експорт
    - Скруглення кутів і кольори вкладок налаштовуються і належать конкретній темі
    - Nord, Gruvbox і Rose перероблено - вони були на третину менш контрастні за решту ("замилене скло")
    - Емодзі-значки замінено на справжній набір іконок, однаковий на будь-якій Windows
    - Налаштування перебудовано: усе по картках, залежні опції в одній картці зі своїм перемикачем
    - Масштаб інтерфейсу для кожного окремого вікна (70-180%) - повзунком або Ctrl+колесо
    - Експорт налаштувань частинами; імпорт більше не скидає решту налаштувань до стандартних
    - Діагностика: локальний журнал помилок і краш-звіти, готовий звіт для повідомлення про баг
    - Підсвітка юзерів: правила стали картками, пріоритет змінюється перетягуванням
    - Виправлено перетягування в мод-кнопках, правилах підсвітки та вкладках
    - Кольорові ніки 7TV тепер у юзеркарді, у "Виділених" і в згадуваннях; оновлюються наживо
    - Виправлено кольорову смугу замість ніка й підгальмовування системи при оновленні косметики
    - Плаваючі мод-кнопки при наведенні переїхали над повідомлення, а не на його текст
    - Емоути у приватних повідомленнях нарешті малюються; додано роздільники днів
    - Необов'язкова пауза анімації емоутів, поки вікно поза фокусом
    - Повідомлення Twitch про помилки перекладено українською

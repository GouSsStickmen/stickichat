appId: com.stickmen.stickichat
productName: StickiChat
directories:
  output: release
files:
  - out/**
  - package.json
win:
  target: nsis
  icon: build/icon.ico
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
publish:
  provider: github
  owner: GouSsStickmen
  repo: stickichat
  releaseType: release
# Shown in the in-app "update available" popup (electron-updater reads the GitHub release
# body). Update this list every release — items only, no service/signature footer line.
releaseInfo:
  releaseNotes: |
    StickiChat 0.5.12 - що нового:

    - Чотири нові типи оверлеїв: Святкування, Ціль, Алерт фолова і Рулетка - кожен зі своїм редактором і живим прев'ю
    - Алерт фолова: 13 анімацій появи і 13 зникнення, власні анімації, картинки, маски, звук, черга і вільне розміщення по координатах
    - Рулетка: сектори з вагою, текстом і власними картинками, запуск командою чи нагородою, цокіт по секторах і фанфари на результат
    - Плашки алертів отримали 13 готових форм або власну маску, а обводка й сяйво можуть брати градієнт самої плашки
    - У списку оверлеїв видно, скільки джерел OBS зараз підключено до кожного
    - Сторінка оверлея більше не кешується і сама пише, коли не достукалась до застосунку
    - Повідомлення через /me малюється власним 7TV-паінтом автора
    - Вкладка "Фоловери" в Подіях, запис про фолов у чат і підсвітка для них
    - Транслітерація: "?" більше не стає комою, 7TV-емоути тепер перекладаються
    - У шапці чату видно, які режими увімкнені: фоловери, підписники, емоути, унікальний чат, повільний режим
    - Закритий хайп-трейн лишається закритим до кінця трейну
    - Спліт: канал панелі змінюється на місці, синхронізація прокрутки доступна й у відчепленому вікні
    - Заблокований емоут каже, який рівень підписки його відкриває

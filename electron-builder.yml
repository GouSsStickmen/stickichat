appId: com.stickmen.stickichat
productName: StickiChat
directories:
  output: release
files:
  - out/**
  - package.json
win:
  target: nsis
  icon: build/icon.ico
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
publish:
  provider: github
  owner: GouSsStickmen
  repo: stickichat
  releaseType: release
# Shown in the in-app "update available" popup (electron-updater reads the GitHub release
# body). Update this list every release — items only, no service/signature footer line.
releaseInfo:
  releaseNotes: |
    StickiChat 0.5.7 — що нового:

    • Емоути: клік відкриває сторінку емоута (7TV/BTTV/FFZ) або канал власника (Twitch), Ctrl+клік — канал автора, Alt+клік — зберегти в обране
    • Комбіновані емоути з кількох шарів: показуються зібраними в пікері, обраному й на оверлеї; ПКМ вставляє всю комбінацію, копіювання з чату нарешті коректне
    • Виправлено кольори ніків 7TV — паінти зі смужками більше не розтягуються, картинкові показуються повністю й у високій якості, додано їхні тіні
    • Бейджі 7TV і BetterTTV у чаті та юзеркарді; у юзеркарді бейджі біля ніка + вся публічна колекція бейджів
    • Прев'ю посилань для YouTube, Vimeo, SoundCloud, Reddit, TikTok і картинок без розширення (kappa.lol); згорнуті у стрілочку, з налаштовуваним передпоказом при наведенні
    • Можна надсилати однакові повідомлення підряд — Twitch більше їх не відхиляє
    • Шаутаути: зворотний відлік до наступного дозволеного
    • Синхронна прокрутка чатів у спліті (кнопка 🔗)
    • Масштаб чату і вкладок розділено; чат масштабується разом з емоутами, максимум 40px
    • Копіювання з чату більше не втрачає пробіли й не тягне службові символи кнопок
    • Ніки без «@» підсвічуються кольором користувача, ПКМ вставляє їх в інпут
    • Оверлей: один тригер на повідомлення (за першим написаним словом), текст замість бейджа, ефект скла в редакторі
    • Виправлено час таймауту в повідомленнях

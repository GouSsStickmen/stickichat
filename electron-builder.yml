appId: com.stickmen.stickichat
productName: StickiChat
# Windows puts FileDescription in the Task Manager's name column, and FileDescription comes from
# the description field. Left to package.json it showed the whole one-line pitch about multi-chat
# and 7TV emotes, which is a fine sentence for a repository and a terrible name for a process.
extraMetadata:
  description: StickiChat
directories:
  output: release
files:
  - out/**
  - package.json
win:
  target: nsis
  icon: build/icon.ico
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
publish:
  provider: github
  owner: GouSsStickmen
  repo: stickichat
  releaseType: release
# Shown in the in-app "update available" popup and as the GitHub release body
# (electron-updater reads that body). Generated from changelog.ts by scripts/release.ps1 on every
# publish, so it can no longer be left describing the version before this one.
releaseInfo:
  releaseNotesFile: release-notes.md
